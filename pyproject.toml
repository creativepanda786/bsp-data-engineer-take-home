[project]
name = "pawsfirst-veterinary-warehouse"
version = "0.1.0"
description = "PawsFirst Veterinary Network — Data Warehouse Take-Home Exercise"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb>=1.2.0,<1.3.0",
    "prefect>=3.1.0",
    "polars>=1.0.0",
    "pyarrow>=18.0.0",
    "soda-duckdb>=4.0.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
