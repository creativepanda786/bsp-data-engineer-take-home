dataset: bronze.vet_owner

columns:
  - name: owner_id
    data_type: integer
    checks:
      - missing:
          name: owner_id is always populated

  - name: first_name
    data_type: varchar
    checks:
      - missing:
          name: first_name is always populated

  - name: last_name
    data_type: varchar
    checks:
      - missing:
          name: last_name is always populated

checks:
  - schema:
      name: Schema matches expected structure
      allow_extra_columns: true
      allow_other_column_order: true

  - row_count:
      name: At least 1000 owner records
      threshold:
        must_be_greater_than: 1000
