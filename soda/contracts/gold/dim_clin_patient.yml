dataset: pawsfirst/gold/dim_clin_patient

columns:
  - name: patient_sk
    data_type: varchar
    checks:
      - missing:
          name: patient_sk is always populated
  - name: patient_id
    data_type: integer
    checks:
      - missing:
          name: patient_id is always populated
  - name: patient_name
    data_type: varchar
  - name: species
    data_type: varchar
  - name: breed
    data_type: varchar
  - name: date_of_birth
    data_type: date
  - name: sex
    data_type: varchar
  - name: clinic_id
    data_type: integer
  - name: insurance_provider
    data_type: varchar
  - name: is_active
    data_type: boolean
  - name: effective_start
    data_type: timestamp
    checks:
      - missing:
          name: effective_start is always populated
  - name: effective_end
    data_type: timestamp
  - name: is_current
    data_type: boolean
    checks:
      - missing:
          name: is_current is always populated
  - name: row_hash
    data_type: varchar

checks:
  - schema:
      name: Schema matches expected structure
      allow_extra_columns: true
      allow_other_column_order: true
  - row_count:
      name: At least 2000 patient dimension rows
      threshold:
        must_be_greater_than_or_equal: 2000
  - failed_rows:
      name: SCD2 integrity violations
      query: |
        SELECT 'duplicate surrogate key' AS reason, patient_sk::varchar AS id
        FROM gold.dim_clin_patient
        GROUP BY patient_sk HAVING COUNT(*) > 1
        UNION ALL
        SELECT 'invalid effective range' AS reason, patient_sk::varchar AS id
        FROM gold.dim_clin_patient
        WHERE effective_end IS NOT NULL
          AND effective_end <= effective_start