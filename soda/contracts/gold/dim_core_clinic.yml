dataset: pawsfirst/gold/dim_core_clinic

columns:
  - name: clinic_sk
    data_type: varchar
    checks:
      - missing:
          name: clinic_sk is always populated
  - name: clinic_id
    data_type: integer
    checks:
      - missing:
          name: clinic_id is always populated
  - name: clinic_name
    data_type: varchar
  - name: city
    data_type: varchar
  - name: state
    data_type: varchar
  - name: area
    data_type: varchar
  - name: opened_date
    data_type: date
  - name: closed_date
    data_type: date
  - name: renamed_to
    data_type: varchar
  - name: effective_start
    data_type: timestamp
    checks:
      - missing:
          name: effective_start is always populated
  - name: effective_end
    data_type: timestamp
  - name: is_current
    data_type: boolean
    checks:
      - missing:
          name: is_current is always populated
  - name: row_hash
    data_type: varchar
    checks:
      - missing:
          name: row_hash is always populated

checks:
  - schema:
      name: Schema matches expected structure
      allow_extra_columns: true
      allow_other_column_order: true
  - row_count:
      name: At least 12 clinic dimension rows
      threshold:
        must_be_greater_than_or_equal: 12
  - failed_rows:
      name: SCD2 integrity violations
      query: |
        SELECT 'duplicate surrogate key' AS reason, clinic_sk AS id
        FROM gold.dim_core_clinic
        GROUP BY clinic_sk HAVING COUNT(*) > 1
        UNION ALL
        SELECT 'invalid effective range' AS reason, clinic_sk AS id
        FROM gold.dim_core_clinic
        WHERE effective_end IS NOT NULL
          AND effective_end <= effective_start