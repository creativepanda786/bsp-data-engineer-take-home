dataset: pawsfirst/gold/ref_core_budget_target

columns:
  - name: clinic_id
    data_type: integer
    checks:
      - missing:
          name: clinic_id is always populated
  - name: clinic_name
    data_type: varchar
  - name: clinic_area
    data_type: varchar
  - name: year
    data_type: integer
  - name: month
    data_type: integer
  - name: budget_month_date
    data_type: date
    checks:
      - missing:
          name: budget_month_date is always populated
  - name: target_revenue
    data_type: double
    checks:
      - missing:
          name: target_revenue is always populated
  - name: target_appointments
    data_type: integer
  - name: target_new_patients
    data_type: integer

checks:
  - schema:
      name: Schema matches expected structure
      allow_extra_columns: true
      allow_other_column_order: true
  - row_count:
      name: Exactly 144 budget rows
      threshold:
        must_be: 144
  - failed_rows:
      name: Data quality checks
      query: |
        SELECT * FROM gold.ref_core_budget_target
        WHERE (month < 1 OR month > 12)
           OR (target_revenue < 0)