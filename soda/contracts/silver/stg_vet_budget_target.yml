dataset: pawsfirst/silver/stg_vet_budget_target

columns:
  - name: clinic_id
    data_type: integer
    checks:
      - missing:
          name: clinic_id is always populated
  - name: clinic_name
    data_type: varchar
  - name: year
    data_type: integer
  - name: month
    data_type: integer
  - name: target_revenue
    data_type: double
    checks:
      - missing:
          name: target_revenue is always populated
  - name: target_appointments
    data_type: integer
  - name: target_new_patients
    data_type: integer

checks:
  - schema:
      name: Schema matches expected structure
      allow_extra_columns: true
      allow_other_column_order: true
  - row_count:
      name: Exactly 144 budget rows
      threshold:
        must_be: 144
  - failed_rows:
      name: Business rule violations
      query: |
        SELECT 'month out of range' AS reason, * FROM silver.stg_vet_budget_target
        WHERE month < 1 OR month > 12
        UNION ALL
        SELECT 'negative target revenue' AS reason, * FROM silver.stg_vet_budget_target
        WHERE target_revenue < 0