dataset: pawsfirst/silver/stg_vet_invoice

columns:
  - name: invoice_id
    data_type: integer
    checks:
      - missing:
          name: invoice_id is always populated
  - name: appointment_id
    data_type: integer
  - name: patient_id
    data_type: integer
    checks:
      - missing:
          name: patient_id is always populated
  - name: clinic_id
    data_type: integer
    checks:
      - missing:
          name: clinic_id is always populated
  - name: service_code
    data_type: varchar
  - name: amount
    data_type: double
  - name: payment_type
    data_type: varchar
  - name: insurance_paid
    data_type: double
  - name: patient_paid
    data_type: double
  - name: invoice_documented_date
    data_type: date
  - name: invoice_paid_date
    data_type: date
  - name: is_paid
    data_type: boolean
  - name: is_outstanding
    data_type: boolean
  - name: is_partial
    data_type: boolean
  - name: has_insurance_payment
    data_type: boolean
  - name: collection_rate
    data_type: double
  - name: status
    data_type: varchar
  - name: created_at
    data_type: timestamp
  - name: updated_at
    data_type: timestamp

checks:
  - schema:
      name: Schema matches expected structure
      allow_extra_columns: true
      allow_other_column_order: true
  - row_count:
      name: At least 4000 invoice records
      threshold:
        must_be_greater_than: 4000
  - failed_rows:
      name: Business rule violations
      query: |
        SELECT 'negative amount' AS reason, * FROM silver.stg_vet_invoice
        WHERE amount < 0
        UNION ALL
        SELECT 'insurance exceeds amount' AS reason, * FROM silver.stg_vet_invoice
        WHERE insurance_paid > amount
        UNION ALL
        SELECT 'unknown status' AS reason, * FROM silver.stg_vet_invoice
        WHERE status NOT IN ('paid', 'partial', 'outstanding')