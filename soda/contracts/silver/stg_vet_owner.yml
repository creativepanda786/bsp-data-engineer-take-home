dataset: pawsfirst/silver/stg_vet_owner

columns:
  - name: owner_id
    data_type: integer
    checks:
      - missing:
          name: owner_id is always populated
      - duplicate:
          name: owner_id is unique
  - name: first_name
    data_type: varchar
  - name: last_name
    data_type: varchar
  - name: full_name
    data_type: varchar
    checks:
      - missing:
          name: full_name is always populated
  - name: email
    data_type: varchar
  - name: phone
    data_type: varchar
  - name: city
    data_type: varchar
  - name: state
    data_type: varchar
  - name: has_duplicate_phone
    data_type: boolean
  - name: phone_owner_count
    data_type: bigint
  - name: has_duplicate_email
    data_type: boolean
  - name: email_owner_count
    data_type: bigint
  - name: created_at
    data_type: timestamp
  - name: updated_at
    data_type: timestamp

checks:
  - schema:
      name: Schema matches expected structure
      allow_extra_columns: true
      allow_other_column_order: true
  - row_count:
      name: At least one owner record
      threshold:
        must_be_greater_than: 0
