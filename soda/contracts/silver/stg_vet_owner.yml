dataset: stg_vet_owner
schema: silver

columns:
  - name: owner_id
    data_type: INTEGER
  - name: first_name
    data_type: VARCHAR
  - name: last_name
    data_type: VARCHAR
  - name: full_name
    data_type: VARCHAR
  - name: email
    data_type: VARCHAR
  - name: phone
    data_type: VARCHAR
  - name: city
    data_type: VARCHAR
  - name: state
    data_type: VARCHAR
  - name: has_duplicate_phone
    data_type: BOOLEAN
  - name: phone_owner_count
    data_type: BIGINT
  - name: has_duplicate_email
    data_type: BOOLEAN
  - name: email_owner_count
    data_type: BIGINT
  - name: created_at
    data_type: TIMESTAMP
  - name: updated_at
    data_type: TIMESTAMP

checks:
  - row_count > 0
  - missing_count(owner_id) = 0
  - missing_count(full_name) = 0
  - duplicate_count(owner_id) = 0
